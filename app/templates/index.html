<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Social - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/">RedSocial AD26</a>
            <div class="d-flex align-items-center">
                <span class="navbar-text me-3 text-white">Hola, <strong>{{ usuario }}</strong></span>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row mb-4">
            <div class="col-md-8 mx-auto">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-3">Buscar Publicaciones por Usuario</h4>
                    <form action="/buscar" method="GET" class="d-flex gap-2">
                        <input type="text" name="usuario" class="form-control" placeholder="Nombre del usuario (ej. mau)..." required>
                        <button type="submit" class="btn btn-primary">Buscar</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8 mx-auto">
                <h5 class="mb-3 text-secondary">Publicaciones Recientes</h5>
                {% if publicaciones %}
                    {% for pub in publicaciones %}
                        <div class="card shadow-sm mb-3">
                            <div class="card-body">
                                <h6 class="card-subtitle mb-2 text-primary fw-bold">@{{ pub.usuario }}</h6>
                                <p class="card-text fs-5">{{ pub.contenido }}</p>
                                <span class="badge bg-secondary">{{ pub.fecha }}</span>
                            </div>
                        </div>
                    {% endfor %}
                {% else %}
                    <div class="alert alert-info text-center">No se encontraron publicaciones.</div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
