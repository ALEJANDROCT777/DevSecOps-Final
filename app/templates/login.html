<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Social - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: #fff; }
        .card-login { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="container" style="max-width: 420px;">
        <div class="card card-login p-4 shadow-lg">
            <h3 class="text-center mb-4 fw-bold text-primary">RedSocial AD26</h3>
            {% if error %}
                <div class="alert alert-danger py-2 mb-3 small">{{ error }}</div>
            {% endif %}
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label text-light">Usuario</label>
                    <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required placeholder="admin">
                </div>
                <div class="mb-3">
                    <label class="form-label text-light">Contraseña</label>
                    <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Iniciar Sesión</button>
            </form>
        </div>
    </div>
</body>
</html>
